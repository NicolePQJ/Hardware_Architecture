mapper:
  algorithm: random-pruned
  max-permutations-per-if-visit: 16
  num-threads: 16
  optimization-metrics:
  - delay
  - energy
  timeout: 3000
  victory-condition: 2000
mapspace_constraints:
  targets:
  - factors: R=1 S=1 P=1
    permutation: RSP CMNQ
    target: BackingStorage
    type: temporal
problem:
  instance:
    C: 48
    Hdilation: 1
    Hstride: 1
    M: 256
    N: 4
    P: 28
    Q: 28
    R: 5
    S: 5
    Wdilation: 1
    Wstride: 1
    densities:
      Inputs: 0.6
      Outputs: 0.169
      Weights: 0.385306
  shape:
    coefficients:
    - default: 1
      name: Wstride
    - default: 1
      name: Hstride
    - default: 1
      name: Wdilation
    - default: 1
      name: Hdilation
    data-spaces:
    - name: Weights
      projection:
      - - - C
      - - - M
      - - - R
      - - - S
    - name: Inputs
      projection:
      - - - N
      - - - C
      - - - R
          - Wdilation
        - - P
          - Wstride
      - - - S
          - Hdilation
        - - Q
          - Hstride
    - name: Outputs
      projection:
      - - - N
      - - - M
      - - - Q
      - - - P
      read-write: true
    dimensions:
    - C
    - M
    - R
    - S
    - N
    - P
    - Q
    name: CNN-Layer
sparse_optimizations:
  targets:
  - name: BackingStorage
    representation-format:
      data-spaces:
      - name: Inputs
        ranks:
        - flattened-rankIDs:
          - - R
            - S
            - P
            - C
            - M
            - N
            - Q
          format: UOP
        - flattened-rankIDs:
          - - R
            - S
            - P
            - C
            - M
            - N
            - Q
          format: RLE
          payload-word-bits: 5
      - name: Outputs
        ranks:
        - flattened-rankIDs:
          - - P
            - M
            - N
            - Q
          format: UOP
        - flattened-rankIDs:
          - - P
            - M
            - N
            - Q
          format: RLE
          payload-word-bits: 5
