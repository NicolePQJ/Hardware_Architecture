sparse_optimizations:
  targets:
    - name: DRAM
      representation-format:
        data-spaces:
          - name: Inputs
            ranks:
              # - format: UOP
              # - format: UOP
              - format: UOP
                flattened-rankIDs: [ [R, S, P, C, M, N, Q] ]
                # metadata-word-bits: 4
              - format: RLE
                flattened-rankIDs: [ [R, S, P, C, M, N, Q] ]
                payload-word-bits: 5
            # rank-application-order: inner-to-outer
          
          - name: Outputs
            ranks:
              - format: UOP
                flattened-rankIDs: [ [P, M, N, Q] ]
              - format: RLE
                flattened-rankIDs: [ [P, M, N, Q] ]
                payload-word-bits: 5
            # rank-application-order: inner-to-outer

            
    - name: weight_spad
      action-optimization:
        - type: gating
          options:
            - target: Weights
              condition-on: [ Inputs ]
    - name: iact_spad
      action-optimization:
        - type: gating
          options:
            - target: Inputs
              condition-on: [ Weights ]
    - name: psum_spad
      action-optimization:
        - type: skipping
          options:
            - target: Outputs
              condition-on: [ Inputs, Weights ]
            
