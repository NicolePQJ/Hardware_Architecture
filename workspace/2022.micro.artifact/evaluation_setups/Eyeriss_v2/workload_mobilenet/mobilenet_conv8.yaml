problem:
  instance:
    Hdilation: 1
    Hstride: 1
    C: 512
    M: 512
    N: 1
    R: 1
    S: 1
    P: 4
    Q: 4
    G: 1
    Wdilation: 1
    Wstride: 1
    densities:
      Inputs: 0.58
      Weights: 0.30
#       Outputs: 0.378
  shape:
    coefficients:
    - default: 1
      name: Wstride
    - default: 1
      name: Hstride
    - default: 1
      name: Wdilation
    - default: 1
      name: Hdilation
    data-spaces:
    - name: Weights
      projection:
      - - - C
      - - - M
      - - - G
      - - - R
      - - - S
    - name: Inputs
      projection:
      - - - N
      - - - C
      - - - G
      - - - R
          - Wdilation
        - - P
          - Wstride
      - - - S
          - Hdilation
        - - Q
          - Hstride
    - name: Outputs
      projection:
      - - - N
      - - - G
      - - - M
      - - - Q
      - - - P
      read-write: true
    dimensions:
    - C
    - M
    - R
    - S
    - N
    - P
    - Q
    - G
    name: CNN-Layer
