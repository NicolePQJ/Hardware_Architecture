
architecture:
  version: 0.3        
  subtree:
    - name: eyeriss_v2
      attributes:
        technology: 45nm
      local:
        - name: DRAM
          class: DRAM
          subclass: DRAM_metadata
          attributes:
            width: 64
            block_size: 4
            datawidth: 16
            metadata_datawidth: 5
            metadata_storage_width: 5 
            # decompression_supported: true  # from DRAM decompression
            # compression_supported: true

      subtree:
        - name: glb_pe_cluster[0..15]
          attributes:
            meshX: 8
            meshY: 2
          local:
            - name: glb_iact
              class: smartbuffer_metadata
              attributes:
                data_storage_depth: 16000 #576
                data_storage_width: 64
                block_size: 4
                n_banks: 3
                read_bandwidth: 192
                write_bandwidth: 192
                metadata_storage_depth: 256 #
                metadata_storage_width: 16 #
                metadata_block_size: 1
                metadata_datawidth: 4  
                metadata_counter_width: 9
                decompression_supported: true  # from DRAM decompression
                compression_supported: true  
            - name: glb_psum
              class: smartbuffer_metadata
              attributes:
                data_storage_depth: 960
                data_storage_width: 64
                block_size: 4
                n_banks: 4
                read_bandwidth: 256
                write_bandwidth: 256
                metadata_storage_depth: 0
                metadata_storage_width: 0
                metadata_block_size: 1
                metadata_datawidth: 0
                metadata_counter_width: 9
                decompression_supported: true  # from DRAM decompression
                compression_supported: true  
          subtree:
            - name: PE[0..11]
              attributes:
                meshX: 3
                meshY: 4  
              local:
                - name: iact_spad
                  class: storage
                  subclass: SRAM_MD 
                  attributes:
                    data_storage_depth: 36 #12
                    data_storage_width: 16
                    metadata_storage_depth: 25  # 25  # 9 addr entries, 16 run entries   
                    metadata_storage_width: 4
                    datawidth: 8
                    block_size: 1
                    decompression_supported: true  # from DRAM decompression
                    compression_supported: true
                    #meshX: 3
                - name: weight_spad
                  class: storage
                  subclass: SRAM_MD
                  attributes:
                    data_storage_depth: 96      
                    data_storage_width: 24
                    metadata_storage_depth: 128  # 16 7b addr entries, 192 4b run entries
                    metadata_storage_width: 8
                    datawidth: 8
                    block_size: 1
                    #meshX: 3
                    decompression_supported: true  # from DRAM decompression
                    compression_supported: true
                - name: psum_spad
                  class: storage
                  subclass: SRAM
                  attributes:
                    depth: 64 #32
                    width: 20
                    datawidth: 10
                    block_size: 1
                    #meshX: 3
                    decompression_supported: true  # from DRAM decompression
                    compression_supported: true
                - name: reg
                  class: storage
                  subclass: SRAM_MD # we use sram for regfile, sram, and reg, the plug-in uses the right energy number
                  attributes:
                    data_storage_depth: 8
                    data_storage_width: 8
                    metadata_storage_width: 4
                    metadata_storage_depth: 1
                    datawidth: 8
                    decompression_supported: true  # from DRAM decompression
                    compression_supported: true
                    #meshX: 3
                - name: MAC
                  class: compute
                  subclass: Imac
                  attributes:
                    datawidth: 8
                    #meshX: 3
