sparse_optimizations:
  targets:

    ##### DRAM (always compressed) #####
    - name: DRAM
      representation-format:
        data-spaces:
          - name: Inputs
            ranks:
              - format: RLE
                flattened-rankIDs: [[R, S, P, C, M, N, Q]]
                payload-word-bits: 16      # = DRAM.datawidth
          - name: Weights
            ranks:
              - format: RLE
                flattened-rankIDs: [[R, S, C, M]]
                payload-word-bits: 16
          - name: Outputs
            ranks:
              - format: RLE
                flattened-rankIDs: [[P, M, N, Q]]
                payload-word-bits: 16

    ##### Shared GLB (Inputs, Outputs & Weights all RLE) #####
    - name: shared_glb
      representation-format:
        data-spaces:
          - name: Inputs
            ranks:
              - format: RLE
                flattened-rankIDs: [[R, S, P, C, M, N, Q]]
                payload-word-bits: 16    # = shared_glb.datawidth
          - name: Weights
            ranks:
              - format: RLE
                flattened-rankIDs: [[R, S, C, M]]
                payload-word-bits: 16
          - name: Outputs
            ranks:
              - format: RLE
                flattened-rankIDs: [[P, M, N, Q]]
                payload-word-bits: 16

    ##### IFMap SPad (Inputs RLE) #####
    - name: ifmap_spad
      representation-format:
        data-spaces:
          - name: Inputs
            ranks:
              - format: RLE
                flattened-rankIDs: [[R, S, P, C, M, N, Q]]
                payload-word-bits: 17    # = ifmap_spad.datawidth

    ##### Weight SPad (Weights RLE) #####
    - name: weights_spad
      representation-format:
        data-spaces:
          - name: Weights
            ranks:
              - format: RLE
                flattened-rankIDs: [[R, S, C, M]]
                payload-word-bits: 16    # = weights_spad.datawidth

    ##### PSum SPad (Outputs RLE) #####
    - name: psum_spad
      representation-format:
        data-spaces:
          - name: Outputs
            ranks:
              - format: RLE
                flattened-rankIDs: [[P, M, N, Q]]
                payload-word-bits: 16